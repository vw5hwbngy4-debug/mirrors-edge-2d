<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05090c">
<title>Suzhou Tactical Telemetry · SpawnMap</title>
<link rel="stylesheet" href="/image-to-unreal-map/viewer/telemetry.css?v=85">
</head>
<body>
<div class="loading" data-loading><i></i><span>LOADING SESSION EVIDENCE</span></div>
<spawnborn-map-preview></spawnborn-map-preview>

<div class="telemetry-hud" data-hud hidden>
  <div class="telemetry-head">
    <div class="session-state archived" data-session-state><i></i><span>SESSION 001 · BOT-ONLY ARCHIVE</span></div>
    <div class="telemetry-totals">
      <span><b data-death-total>15</b> DEATHS</span>
      <span><b data-spawn-total>32</b> SPAWNS</span>
    </div>
  </div>

  <section class="hot-zones">
    <small>HOT ZONES · DEATHS</small>
    <div data-hot-zones></div>
  </section>

  <section class="leaderboard">
    <div class="leaderboard-head"><small>TOP PLAYERS</small><b data-live-tag>NO LIVE SCOREBOARD</b></div>
    <ol data-leaderboard>
      <li class="empty">Collector does not publish player ranking yet.</li>
    </ol>
  </section>

  <div class="telemetry-legend">
    <span><i class="death-dot"></i> DEATH HOTSPOT</span>
    <span><i class="kill-dot"></i> KILL POSITION</span>
    <span><i class="flow-line"></i> OBSERVED FLOW</span>
  </div>
</div>

<script src="/image-to-unreal-map/viewer/preview/vendor/three.min.js"></script>
<script src="/image-to-unreal-map/viewer/preview/vendor/three-orbit-controls.js"></script>
<script src="/image-to-unreal-map/viewer/asset-cache/asset-cache-manifest.js"></script>
<script src="/image-to-unreal-map/viewer/asset-cache/my-level-manifest.js?v=11"></script>
<script src="/image-to-unreal-map/viewer/asset-cache/asset-resolver.js"></script>
<script src="/image-to-unreal-map/viewer/preview/t3d-parser.js"></script>
<script src="/image-to-unreal-map/viewer/preview/spawnborn-map-preview.js?v=telemetry85"></script>
<script src="/image-to-unreal-map/data/suzhou-telemetry-feed.js?v=85"></script>
<script src="/image-to-unreal-map/viewer/telemetry.js?v=85"></script>
<script src="/image-to-unreal-map/viewer/feed-gesture-bridge.js?v=85"></script>
</body>
</html>
